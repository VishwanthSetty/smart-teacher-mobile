<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Teacher - Splash</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;family=Nunito+Sans:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#2196F3',
                            dark: '#0D47A1',
                            light: '#90CAF9',
                            container: '#E3F2FD'
                        },
                        neutral: {
                            dark: '#12263A',
                            DEFAULT: '#5B6B7B',
                            light: '#93A2B0'
                        },
                        semantic: {
                            success: '#2E7D32',
                            warning: '#F9A825',
                            error: '#D32F2F'
                        }
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        lg: "1.75rem", // 28px
                        xl: "3rem",
                        full: "9999px"
                    },
                    fontFamily: {
                        headline: ["Fredoka", "sans-serif"],
                        display: ["Fredoka", "sans-serif"],
                        body: ["Nunito Sans", "sans-serif"],
                        label: ["Nunito Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        @keyframes pulse-dot {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }
        .dot-1 { animation: pulse-dot 1.5s infinite ease-in-out; }
        .dot-2 { animation: pulse-dot 1.5s infinite ease-in-out 0.2s; }
        .dot-3 { animation: pulse-dot 1.5s infinite ease-in-out 0.4s; }
        
        .float-slow {
            animation: float 6s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-primary-container to-white min-h-screen w-full font-body overflow-hidden relative selection:bg-primary-light selection:text-primary-dark">
<!-- Background Decor: Soft Circles -->
<div class="absolute -top-16 -left-16 w-64 h-64 bg-primary-light rounded-full opacity-20 blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-24 -right-24 w-80 h-80 bg-primary-light rounded-full opacity-20 blur-3xl pointer-events-none"></div>
<!-- Background Decor: Floating Stars -->
<svg class="absolute top-1/4 left-8 w-4 h-4 text-primary-light opacity-40 float-slow pointer-events-none" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2l2.4 7.4h7.6l-6.2 4.5 2.4 7.4-6.2-4.5-6.2 4.5 2.4-7.4-6.2-4.5h7.6z"></path>
</svg>
<svg class="absolute top-1/3 right-12 w-3 h-3 text-primary-light opacity-30 float-slow pointer-events-none" fill="currentColor" style="animation-delay: 1s;" viewbox="0 0 24 24">
<path d="M12 2l2.4 7.4h7.6l-6.2 4.5 2.4 7.4-6.2-4.5-6.2 4.5 2.4-7.4-6.2-4.5h7.6z"></path>
</svg>
<svg class="absolute bottom-1/4 left-1/4 w-5 h-5 text-primary-light opacity-20 float-slow pointer-events-none" fill="currentColor" style="animation-delay: 2s;" viewbox="0 0 24 24">
<path d="M12 2l2.4 7.4h7.6l-6.2 4.5 2.4 7.4-6.2-4.5-6.2 4.5 2.4-7.4-6.2-4.5h7.6z"></path>
</svg>
<!-- Main Content Container -->
<main class="relative z-10 w-full min-h-screen flex flex-col items-center justify-center max-w-[390px] mx-auto px-6">
<!-- Logo -->
<div class="mb-6 rounded-3xl overflow-hidden shadow-[0_12px_32px_rgba(13,71,161,0.12)]">
<img alt="Smart Teacher App Logo" class="w-[120px] h-[120px] object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1UQivWMT9LzSlvFNRLeRk_ferpxaRjPkTufBInrb8PxuflW0Y_DoLK2Lq-hCmEDKSUSLJDZq4JRh2IchUSw_7Vw9oVlWGzmLTu1NhtLaZcp2DEnBjS0vswFQnBI5lTMBJjgQNVbVY43PmLiJxvgUDjuqB8DGi7_vvolCc3maxlWwxxotofYOt8z8cGsIX0VSrmF1UHaXmbUeSBbbmU5KcIxHRyD_5mzZmssFbkq1PRCJCdDKs5qyp68UnM"/>
</div>
<!-- Typography -->
<h1 class="font-headline font-bold text-[28px] text-primary-dark mb-2 tracking-tight">Smart Teacher</h1>
<p class="font-body text-[15px] text-neutral mb-12">Learning, made simple</p>
<!-- Loading Indicator -->
<div class="flex gap-2 items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-primary-light dot-1"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary-light dot-2"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary-light dot-3"></div>
</div>
</main>
</body></html>
